name: Automatic API deployment ✨

on:

  # Trigger workflow when pushing to "dev"
  push:
    branches:
      - dev

  # Add manual triggers too
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      #
      # Checkout source code
      #
      - name: Checkout source code
        uses: actions/checkout@v4

      #
      # Setup .NET SDK
      #
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with: 
          dotnet-version: '10.0.x'

      #
      # Restore dependencies
      #
      - name: Restore EF tools
        run: dotnet tool restore

      #
      # Build and publish
      #
      - name: Publish
        run: dotnet publish -c Release -o ./publish

      #
      # Run migrations
      #
      - name: Run migrations
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.KUVDB_CONNECTION_STRING }}
        run: dotnet ef database update --project kuv-api.csproj

      #
      # Generate environments file
      #
      - name: Generate environments file
        run: |
          sed \
          -e "s|{{KUVDB_CONNECTION_STRING}}|${{ secrets.KUVDB_CONNECTION_STRING }}|g" \
          -e "s|{{JWT_KEY}}|${{ secrets.JWT_KEY }}|g" \
          Deploy/kuv-api.env > ./publish/kuv-api.env
        
      #
      # Deploy to VPS
      #
      - name: Deploy to VPS
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.VPS_HOST }}
          REMOTE_USER: ${{ secrets.VPS_USER }}
          SOURCE: "./publish/"
          TARGET: "/var/www/kuv-api"
          ARGS: "-rlgoDzP --delete"
          SCRIPT_AFTER: sudo systemctl restart kuv-api.service

      #
      # Notify discord about deploy :3
      #
      - name: Tell discord everything OK
        if: success()
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ vars.DISCORD_BACK_WEBHOOK }}
          embed-title: "🚀 Ready"
          embed-description: "KuV API is now deployed"
          embed-color: 3066993

      #
      # Notify discord about failure
      #
      - name: Tell discord we died
        if: failure()
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ vars.DISCORD_BACK_WEBHOOK }}
          embed-title: "❌ Fail"
          embed-description: "Tronamos :("
          embed-color: 15158332